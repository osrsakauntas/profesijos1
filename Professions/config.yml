professions:
  farmer:
    display-name: '&aŽemdirbys'
    level-50-title: '&aŽemvaldys'
    description:
      - '&7Žemdirbys augina, prižiūri ir renka savo užaugintą derlių.'
      - '&7XP gauni tik nuėmęs visiškai subrendusius augalus.'
      - '&7Augink ir rink kviečius, morkas, bulves, burokėlius bei cukranendres.'
      - '&7Moliūgai ir melionai suteikia daugiau XP nei įprasti augalai.'
    perks: ['Lucky Harvest I', 'Farmer''s Touch', 'Bonus Crops']
  blacksmith:
    display-name: '&8Amatininkas'
    level-50-title: '&8Runakalys'
    description:
      - '&7Amatininkas specializuojasi vertingų rūdų kasime ir jų išgavime.'
      - '&7XP gauni pats iškasęs registruotą rūdos bloką.'
      - '&7Kask geležies, aukso, deimantų, smaragdų ir raudonųjų dulkių rūdas.'
      - '&7Daugiausia XP suteikia reta senovinių liekanų rūda Nether pasaulyje.'
    perks: ['Extra Ingot I', 'Master Smith']
  enchanter:
    display-name: '&dŽynys'
    level-50-title: '&dOrakulas'
    description:
      - '&7Žynys stiprina daiktus užburtais efektais ir verda eliksyrus.'
      - '&7XP gauni už kiekvieną užbūrimą, atliktą prie užbūrimo stalo.'
      - '&7Taip pat gauni XP išvirdamas paprastus, sprogstamuosius ir ilgai išliekančius eliksyrus.'
      - '&7Kuo daugiau buriesi ir verdi eliksyrų, tuo greičiau kyla tavo lygis.'
    perks: ['Arcane Knowledge']
  baker:
    display-name: '&6Keporius'
    level-50-title: '&6Gyduonis'
    description:
      - '&7Keporius ruošia maistą, kuris padeda žaidėjams atkurti alkio juostą.'
      - '&7XP gauni už kiekvieną rankomis pagamintą registruotą maisto vienetą.'
      - '&7Gamink duoną, pyragus, sausainius, keptą jautieną ir moliūgų pyragą.'
      - '&7Gamindamas daug daiktų vienu metu, XP gauni už visą pagamintą kiekį.'
    perks: ['Fresh Ingredients']
  merchant:
    display-name: '&ePrekeivis'
    level-50-title: '&eMagnatas'
    description:
      - '&7Prekeivis skirtas žaidėjams, kurie užsiima pirkimu ir daiktų pardavimu.'
      - '&7Prekiauk su kaimiečiais, pirk jų prekes ir parduok savo atsargas.'
      - '&7Prekeivio questai fiksuoja kiekvieną sėkmingą prekybą su kaimiečiu.'
    perks: ['Trade Bonus']
  architect:
    display-name: '&bMūrininkas'
    level-50-title: '&bArchitektas'
    description:
      - '&7Mūrininkas stato pastatus, dekoracijas ir kitas pasaulio konstrukcijas.'
      - '&7XP gauni dėdamas registruotus statybinius blokus.'
      - '&7Statyk naudodamas akmenį, trinkeles, ąžuolines lentas, plytas ir kvarco blokus.'
      - '&7Deimantų blokas suteikia daugiausia XP iš visų šiai profesijai skirtų blokų.'
    perks: ['Builder''s Insight']
  fisherman:
    display-name: '&9Žūklys'
    level-50-title: '&9Gelmėnas'
    description:
      - '&7Žūklys gaudo žuvis ir vertingus lobius naudodamas meškerę.'
      - '&7XP gauni tik sėkmingai ištraukęs registruotą laimikį iš vandens.'
      - '&7Gaudyk menkes, lašišas, pūsliažuves ir tropines žuvis.'
      - '&7Daugiau XP suteikia reti laimikiai: užburta knyga, lankas ir nautilo kriauklė.'
    perks: ['Lucky Catch']
  lyderis:
    display-name: '&6Valdovas'
    level-50-title: '&6Archonas'
    description:
      - '&7Valdovas įveikia įvairius pasaulio iššūkius ir rodo pavyzdį kitiems.'
      - '&7Kovok, keliauk, rink išteklius ir kurk svarbius daiktus.'
      - '&7Valdovo questai apima daugelį skirtingų veiklų.'
    perks: ['Leader''s Resolve']
